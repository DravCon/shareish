name: Shareish
options:
  bundleIdPrefix: com.shareish
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Shareish:
    type: application
    platform: iOS
    sources:
      - path: Shareish
        excludes:
          - "**/*.plist"
    resources:
      - path: Shareish/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Shareish/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    info:
      path: Shareish/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Shareish needs camera access to take photos of items you want to give away."
        NSPhotoLibraryUsageDescription: "Shareish needs photo library access to choose photos of items to list."
